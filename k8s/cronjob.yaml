apiVersion: batch/v1
kind: CronJob
metadata:
  name: timestamp-cronjob
spec:
  schedule: "* * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: timestamp-logger
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - echo "CronJob running at: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
